name: Signaux Crypto & Or

on:
  schedule:
    # toutes les 15 min, sur des minutes creuses : les créneaux :00/:15/:30/:45
    # sont saturés chez GitHub et les runs planifiés y sautent ou dérivent de
    # plusieurs heures (constaté : 1h30 à 3h entre deux runs le 20/07)
    - cron: "6,21,36,51 * * * *"
  workflow_dispatch:        # lancement manuel pour tester

permissions:
  contents: write           # nécessaire pour publier data.json vers le cockpit

concurrency:
  group: bot-crypto-or      # partagé avec le copytrading : jamais deux runs en même temps
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # checkout fige le commit du déclenchement ; un run mis en file par la
      # concurrence doit d'abord récupérer ce que le run précédent a poussé
      - name: Se placer sur la pointe de main
        run: git pull --rebase origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Signaux de marché (crypto + or)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      # L'ancien agent Kraken (agent.py, Triple Cross) est retiré : la seule
      # stratégie exécutée est B0 (b0_agent.py, workflow b0.yml). Les signaux
      # TA et /bilan restent en observatoire, sans exécution.

      - name: Publier les données du cockpit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A state.json docs/data.json || true
          git diff --cached --quiet || git commit -m "maj données cockpit (signaux)"
          git pull --rebase origin main
          git push
